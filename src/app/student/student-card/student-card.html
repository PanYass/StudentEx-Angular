<article >
    <h2>{{ student().firstName | uppercase}}  {{student().name | uppercase}}</h2>
    <p>le programme est {{student().program}}</p>



    
    <app-counter-component></app-counter-component>


    <button> selectionner</button> 

    <select (change)="onChange($event)">
        <option value="2026">2026</option>
        <option value="2025">before</option>
        <option value="2027">After</option>


    </select>
    @if(student().graduationYear < currentYear){<p>Alumni</p>}
    @else if (student().graduationYear == currentYear) {<p>en derniere annee</p>}
    @else {<p>etudiant ou etudiante</p>}

    <button type="button" (click)="remove.emit(student().id)">remove</button>


</article>
